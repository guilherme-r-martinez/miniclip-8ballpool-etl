rules:
  - name: normalize_platform
    type: uppercase
    field: platform

  - name: map_country_id_to_name
    type: map_lookup
    source_field: country_id
    target_field: country_name
    default_value: UNKNOWN
    mapping:
      "PT": "Portugal"
      "ES": "Spain"
      "GB": "United Kingdom"
      "US": "United States"
      "BR": "Brazil"
      "FR": "France"
      "DE": "Germany"